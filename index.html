<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students vs Teachers Trivia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>" />
  </head>
  <body>
    <div class="bubbles" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <main class="stage">
      <header class="hero">
        <p class="eyebrow">Classroom Clash</p>
        <h1 class="bubble-title">
          <span class="word students-word">Students</span>
          <span class="vs">VS</span>
          <span class="word teachers-word">Teachers</span>
        </h1>
        <p class="subtitle">Trivia Scoreboard</p>
      </header>

      <section class="board" aria-label="Trivia scoreboard">
        <article class="team-card students" aria-labelledby="students-label">
          <p class="team-emoji" aria-hidden="true">🎒</p>
          <h2 id="students-label" class="team-name bubble-letters">Students</h2>
          <p class="score bubble-letters" id="student-score" aria-live="polite">0</p>
          <div class="score-controls">
            <button type="button" class="score-btn minus" data-team="students" data-delta="-1" aria-label="Subtract one point from students">
              −
            </button>
            <button type="button" class="score-btn plus" data-team="students" data-delta="1" aria-label="Add one point to students">
              +
            </button>
          </div>
        </article>

        <article class="timer-card">
          <h2 class="timer-label bubble-letters">Timer</h2>
          <div class="timer" id="timer" data-state="ready">
            <svg class="timer-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="timer-track" cx="60" cy="60" r="52" />
              <circle class="timer-progress" id="timer-progress" cx="60" cy="60" r="52" />
            </svg>
            <p class="timer-value bubble-letters" id="timer-value" aria-live="polite">15</p>
            <p class="times-up" id="times-up">Time’s<br />Up!</p>
          </div>
          <div class="timer-controls">
            <button type="button" class="timer-btn start" id="start-btn">Start</button>
            <button type="button" class="timer-btn reset" id="reset-btn">Reset</button>
          </div>
        </article>

        <article class="team-card teachers" aria-labelledby="teachers-label">
          <p class="team-emoji" aria-hidden="true">🍎</p>
          <h2 id="teachers-label" class="team-name bubble-letters">Teachers</h2>
          <p class="score bubble-letters" id="teacher-score" aria-live="polite">0</p>
          <div class="score-controls">
            <button type="button" class="score-btn minus" data-team="teachers" data-delta="-1" aria-label="Subtract one point from teachers">
              −
            </button>
            <button type="button" class="score-btn plus" data-team="teachers" data-delta="1" aria-label="Add one point to teachers">
              +
            </button>
          </div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
